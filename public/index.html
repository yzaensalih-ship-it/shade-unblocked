<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shade</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { width: 100%; height: 100%; overflow: hidden; font-family: Arial, Helvetica, sans-serif; background: #2b4ab3; }
        #shade-bg { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; }
        .shade-content { position: relative; z-index: 2; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        .logo { color: white; font-size: 58px; font-weight: 800; letter-spacing: 8px; margin-bottom: 35px; text-shadow: 0 4px 20px rgba(0, 0, 0, 0.25); }
        .url-box { width: min(700px, 95vw); height: 62px; display: flex; align-items: center; background: rgba(255, 255, 255, 0.14); border: 1px solid rgba(255, 255, 255, 0.3); border-radius: 16px; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2); overflow: hidden; }
        .url-box input { flex: 1; height: 100%; border: none; outline: none; background: transparent; color: white; font-size: 17px; padding: 0 20px; }
        .url-box input::placeholder { color: rgba(255, 255, 255, 0.7); }
        .url-box button { height: 100%; min-width: 95px; border: none; cursor: pointer; background: rgba(255, 255, 255, 0.9); color: #2b4ab3; font-size: 16px; font-weight: 700; transition: 0.2s ease; }
        .url-box button:hover { background: white; }
        .url-box button:active { transform: scale(0.97); }
    </style>
</head>
<body>
    <div id="shade-bg"></div>
    <main class="shade-content">
        <div class="logo">SHADE</div>
        <div class="url-box">
            <input id="urlInput" type="text" placeholder="Enter a URL or search DuckDuckGo..." autocomplete="off" spellcheck="false">
            <button id="goButton">GO</button>
        </div>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.clouds.min.js"></script>
    <script>
        VANTA.CLOUDS({
            el: "#shade-bg",
            mouseControls: true, touchControls: true, gyroControls: false,
            minHeight: 200.00, minWidth: 200.00,
            skyColor: 0x2b4ab3, cloudColor: 0x6c8bd7, cloudShadowColor: 0x5f5f5f
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@mercuryworkshop/scramjet@latest/dist/scramjet.bundle.js"></script>
    <script src="script.js"></script>
</body>
</html>
<script src="/script.js"></script>
